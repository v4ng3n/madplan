name: Generate weekly meal plan
on:
  schedule:
    - cron: '15 6 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-madplan
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1
        run: python scripts/generate_madplan.py
      - name: Commit only validated changes
        run: |
          git config user.name "madplan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/madplan.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated weekly meal plan"
            git pull --rebase origin main
            python scripts/validate_madplan.py
            git push origin HEAD:main
          fi
