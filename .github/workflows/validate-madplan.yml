name: Validate meal plan
on:
  push:
    paths:
      - 'public/data/madplan.json'
      - '.automation/preferences.json'
      - 'scripts/validate_madplan.py'
      - '.github/workflows/validate-madplan.yml'
  pull_request:
    paths:
      - 'public/data/madplan.json'
      - '.automation/preferences.json'
      - 'scripts/validate_madplan.py'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate plan
        run: python scripts/validate_madplan.py
