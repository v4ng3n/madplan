name: Validate meal plan
on:
  push:
    paths:
      - 'public/data/madplan.json'
      - '.automation/preferences.json'
      - 'scripts/validate_madplan.py'
      - 'public/app.js'
      - 'src/worker.js'
      - 'public/data/flyers.json'
      - 'tests/**'
      - '.github/workflows/validate-madplan.yml'
  pull_request:
    paths:
      - 'public/data/madplan.json'
      - '.automation/preferences.json'
      - 'scripts/validate_madplan.py'
      - 'public/app.js'
      - 'src/worker.js'
      - 'public/data/flyers.json'
      - 'tests/**'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'Pillow>=11,<13'
      - name: Validate plan
        run: python scripts/validate_madplan.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test image proxy and complete page manifest
        run: node --test tests/*.test.mjs
      - name: Check frontend syntax
        run: node --check public/app.js

      - name: Verify rejection of incorrect offers and missing days
        run: python -m unittest discover -s tests -p "test_*.py"
