name: Sync meal-plan preferences

on:
  workflow_dispatch:
  schedule:
    - cron: "45 5 * * 0"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch selected days
        run: |
          mkdir -p .automation
          curl --fail --silent --show-error --retry 3 \
            https://madplan.v4ng3n.xyz/api/preferences \
            -o .automation/preferences.json
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(".automation/preferences.json","utf8")); if(!d.configured || !Array.isArray(d.selectedDays) || !d.selectedDays.length) process.exit(1)'
      - name: Commit changed preferences
        run: |
          if git diff --quiet -- .automation/preferences.json && ! git ls-files --error-unmatch .automation/preferences.json >/dev/null 2>&1; then
            :
          elif git diff --quiet -- .automation/preferences.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/preferences.json
          git commit -m "Sync meal-plan preferences"
          git push
