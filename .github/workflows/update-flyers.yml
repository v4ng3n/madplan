name: Update and verify complete flyers
on:
  schedule:
    - cron: '10 4,10,16,22 * * *'
  push:
    paths:
      - 'scripts/fetch_flyers.py'
      - '.github/workflows/update-flyers.yml'
      - 'tests/test_flyer_selection.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: madplan-flyers
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TJEK_API_KEY: ${{ secrets.TJEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'Pillow>=11,<13'
      - name: Test weekly flyer selection and edition change
        run: python -m unittest discover -s tests -p "test_flyer_selection.py"
      - name: Fetch and decode every publisher page
        run: python scripts/fetch_flyers.py
      - name: Test complete manifest and image proxy
        run: node --test tests/flyers.test.mjs
      - name: Publish verified manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/flyers.json public/data/flyer-editions
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh complete verified retailer flyers"
          git pull --rebase origin main
          git push origin HEAD:main
